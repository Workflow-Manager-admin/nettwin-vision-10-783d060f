<!DOCTYPE html>
<html lang="en" data-theme="{{ theme.scheme }}">
<head>
    <meta charset="UTF-8">
    <title>Network Map Demo</title>
    <link rel="stylesheet" href="/static/demo.css">
    <style>
        .network-card { background: #fff; border-radius: 1em; box-shadow: 0 2px 7px rgba(24,24,27,0.08); padding: 1.25em 1.5em; }
        .map-legend { margin-top:1.4em; margin-bottom:.8em; }
        .map-legend span { display:inline-block; margin-right:2em; font-size:0.96em; }
        .color-dot { display:inline-block; width:12px; height:12px; border-radius:6px; vertical-align:middle; margin-right:0.4em;}
        @media (prefers-color-scheme: dark) { .network-card { background: #18181b; color: #f4f4f5; } }
    </style>
</head>
<body>
    <div class="main">
        <h1>Network Map</h1>
        <div class="network-card accent">
            <b>Network Topology Demo</b>
            <div class="map-legend">
                <span><span class="color-dot" style="background:#2563eb"></span>Active Site</span>
                <span><span class="color-dot" style="background:#fbbf24"></span>Planned Site/Alerted Link</span>
                <span><span class="color-dot" style="background:#22c55e"></span>Active Link</span>
                <span><span class="color-dot" style="background:#e11d48"></span>Degraded Link</span>
            </div>
            <div style="overflow:auto; width:max-content;">
            <!-- Inline SVG for network map -->
            <svg id="netMapSvg" viewBox="0 0 480 300" width="450" height="280">
                <!-- Sites -->
                <circle cx="240" cy="120" r="25" fill="#2563eb" /> <!-- Central Hub -->
                <text x="230" y="115" fill="#fff" font-size="1.2em">A1</text>
                <text x="222" y="145" font-size="0.92em">Central Hub</text>

                <circle cx="100" cy="50" r="19" fill="#2563eb" />
                <text x="91" y="45" fill="#fff" font-size="1em">A2</text>
                <text x="60" y="75" font-size="0.9em">North Node</text>

                <circle cx="375" cy="60" r="18" fill="#fbbf24"/>
                <text x="367" y="56" fill="#fff" font-size="1em">A3</text>
                <text x="350" y="86" font-size="0.9em">East Node</text>

                <circle cx="170" cy="240" r="19" fill="#2563eb"/>
                <text x="161" y="235" fill="#fff" font-size="1em">A4</text>
                <text x="135" y="265" font-size="0.9em">South Node</text>

                <!-- Links -->
                <line x1="240" y1="120" x2="100" y2="50" stroke="#e11d48" stroke-width="5" />
                <line x1="240" y1="120" x2="375" y2="60" stroke="#22c55e" stroke-width="4" />
                <line x1="100" y1="50" x2="170" y2="240" stroke="#22c55e" stroke-width="4" />
                <line x1="170" y1="240" x2="375" y2="60" stroke="#fbbf24" stroke-width="4" stroke-dasharray="8 4"/>
                <!-- Link Legends -->
                <circle cx="245" cy="90" r="7" fill="#e11d48"/>
                <text x="256" y="95" font-size="0.88em" fill="#e11d48">Degraded</text>
                <circle cx="367" cy="110" r="7" fill="#fbbf24"/>
                <text x="376" y="115" font-size="0.88em" fill="#fbbf24">Planned</text>
            </svg>
            </div>
            <div style="margin-top:1em;color:#888;">
                <b>Legend:</b> Click on nodes or links (interactive in MVP) for details/alerts<br>
                <span style="font-size:0.93em;">(This graphic is a demo: interactive overlays for infra/alerts in MVP.)</span>
            </div>
            <a href="/" class="btn" style="margin-top:1.5em;">Back to Landing</a>
        </div>
    </div>
</body>
</html>
