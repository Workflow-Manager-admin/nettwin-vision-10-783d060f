<!DOCTYPE html>
<html lang="en" data-theme="{{ theme.scheme }}">
<head>
    <meta charset="UTF-8">
    <title>Planning Wizard Demo</title>
    <link rel="stylesheet" href="/static/demo.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .wizard-card {background:#fff; border-radius:1em; box-shadow:0 2px 10px rgba(37,99,235,0.08); padding:1.5em 1.5em;}
        .wizard-stepper {display:flex; gap:2em; margin-bottom:1em;}
        .step {flex-basis:60px; text-align:center; padding:0.7em 0;}
        .step-circle {width:30px; height:30px; background:#2563eb; color:#fff; border-radius:50%; display:inline-block; line-height:30px; font-weight:bold;}
        .step-label {margin-top:0.44em; font-size:0.97em; color:#444;}
        .step.active .step-circle {background:#fbbf24; color:#111;}
        @media (prefers-color-scheme: dark) {
            .wizard-card { background: #18181b; color: #f4f4f5;}
            .step-label{color:#aaa;}
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>Planning Wizard</h1>
        <div class="wizard-card accent">
            <b>Plan New Site / Upgrade</b>
            <div class="wizard-stepper">
                <div class="step active">
                    <div class="step-circle">1</div>
                    <div class="step-label">Select Type</div>
                </div>
                <div class="step">
                    <div class="step-circle" style="background:#2563eb;">2</div>
                    <div class="step-label">Configure</div>
                </div>
                <div class="step">
                    <div class="step-circle" style="background:#2563eb;">3</div>
                    <div class="step-label">Review Impact</div>
                </div>
                <div class="step">
                    <div class="step-circle" style="background:#2563eb;">4</div>
                    <div class="step-label">Approve</div>
                </div>
            </div>
            <div style="margin-top:1em;">
                <b>Before/After Impact (North Node):</b><br>
                <canvas id="impactChart" height="140"></canvas>
            </div>
            <div style="color:#888; margin:.6em 0 1em 0;font-size:0.97em;">
                See how KPIs improve with this plan.<br>
                <i>Alerts reduced from 1 to 0; risk drops substantially.</i>
            </div>
            <a href="/" class="btn" style="margin-top:1em;">Back to Dashboard</a>
        </div>
    </div>
    <script>
    // Before/After Impact Chart (Bar)
    const impactChart = document.getElementById('impactChart').getContext('2d');
    new Chart(impactChart, {
        type: 'bar',
        data: {
            labels: ['Availability (%)','Max Utilization','Risk Score'],
            datasets: [
                {
                    label: 'Before',
                    data: [96.9, 87, 6.5],
                    backgroundColor: '#e11d48'
                },
                {
                    label: 'After',
                    data: [98.2, 66, 2.7],
                    backgroundColor: '#22c55e'
                }
            ]
        },
        options: {
            plugins: { legend: { display: true, position: 'bottom' } },
            scales: {
                y: {beginAtZero:true, max:100},
                x: {ticks:{color:'#666'}}
            }
        }
    });
    </script>
</body>
</html>
