<!DOCTYPE html>
<html lang="en" data-theme="{{ theme.scheme }}">
<head>
    <meta charset="UTF-8">
    <title>Inventory Demo</title>
    <link rel="stylesheet" href="/static/demo.css">
</head>
<body>
    <div class="main">
        <h1>Inventory</h1>
        <div class="card secondary">
            <b>Digital Twin Inventory Table (Preview)</b><br>
            <table border="1" cellpadding="4">
                <tr>
                    <th>ID</th><th>Name</th><th>Status</th><th>Availability</th>
                </tr>
                <tr>
                    <td>A1</td><td>Central Hub</td><td>Active</td><td>98.3%</td>
                </tr>
                <tr>
                    <td>A2</td><td>North Node</td><td>Active</td><td>96.9%</td>
                </tr>
                <tr>
                    <td>A3</td><td>East Node</td><td>Planned</td><td>-</td>
                </tr>
                <tr>
                    <td>A4</td><td>South Node</td><td>Active</td><td>97.5%</td>
                </tr>
            </table>
            <a href="/" class="btn">Back to Landing</a>
        </div>
    </div>
</body>
</html>
