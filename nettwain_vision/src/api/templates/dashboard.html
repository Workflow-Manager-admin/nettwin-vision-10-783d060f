<!DOCTYPE html>
<html lang="en" data-theme="{{ theme.scheme }}">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Demo</title>
    <link rel="stylesheet" href="/static/demo.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5em;
        }
        .kpi-card {
            background: #fff;
            border-radius: 1em;
            box-shadow: 0 2px 8px rgba(37,99,235,0.05);
            padding: 1.5em 2em;
            flex: 1 1 200px;
            min-width: 200px;
            margin-bottom: 1em;
            border-left: 4px solid var(--primary);
        }
        .kpi-card > .kpi-title {
            font-size: 1.1em;
            color: var(--primary);
            margin-bottom: 0.5em;
        }
        .kpi-value {
            font-size: 2.2em;
            font-weight: bold;
            margin-bottom: 0.3em;
        }
        .trend-up { color: #22c55e; }
        .trend-down { color: #e11d48; }
        @media (prefers-color-scheme: dark) {
            .kpi-card { background: #18181b; color: #f4f4f5; }
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>Dashboard</h1>
        <!-- Modern KPI Cards -->
        <div class="dashboard-grid">
            <div class="kpi-card">
                <div class="kpi-title">Active Sites</div>
                <div class="kpi-value">42</div>
                <div class="trend-up">+3.5%</div>
                <div class="kpi-desc">Total live sites in network</div>
            </div>
            <div class="kpi-card" style="border-left-color: var(--accent);">
                <div class="kpi-title">Planned Upgrades</div>
                <div class="kpi-value">7</div>
                <div class="trend-down">-12%</div>
                <div class="kpi-desc">Planned upgrades in queue</div>
            </div>
            <div class="kpi-card" style="border-left-color: var(--secondary);">
                <div class="kpi-title">Site Alerts</div>
                <div class="kpi-value">2</div>
                <div class="trend-up"></div>
                <div class="kpi-desc">Active alerts flagged by simulation</div>
            </div>
            <div class="kpi-card" style="border-left-color: var(--primary);">
                <div class="kpi-title">Network Health</div>
                <div class="kpi-value">98.3%</div>
                <div class="trend-up">+0.8%</div>
                <div class="kpi-desc">Overall health: SLAs, latency, up-time</div>
            </div>
        </div>
        <!-- Row with a line chart and bar chart -->
        <div class="dashboard-grid" style="gap:3em;">
            <div class="kpi-card" style="min-width:320px;flex:2;">
                <div class="kpi-title">Availability Trend</div>
                <canvas id="availabilityTrend" height="90"></canvas>
            </div>
            <div class="kpi-card" style="min-width:320px;flex:2;">
                <div class="kpi-title">Active Alerts (last week)</div>
                <canvas id="alertTrend" height="90"></canvas>
            </div>
        </div>
        <a href="/" class="btn" style="margin-top:2em;">Back to Landing</a>
    </div>
    <script>
    // Availability KPI Trend - Line Chart
    const ctxAvail = document.getElementById('availabilityTrend').getContext('2d');
    new Chart(ctxAvail, {
        type: 'line',
        data: {
            labels: ['2024-06-15', '2024-06-16', '2024-06-17', '2024-06-18'],
            datasets: [{
                label: 'Availability (%)',
                data: [97.2, 97.7, 98.3, 98.3],
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37,99,235,0.09)',
                fill: true,
                tension: 0.3,
                pointRadius: 4,
                pointBackgroundColor: '#2563eb'
            }]
        },
        options: {
            plugins: {legend: {display: false}},
            scales: {
                y: {beginAtZero: false, min: 96, max: 100},
                x: {ticks:{color:'#555'}}
            }
        }
    });
    // Alerts Trend - Bar Chart
    const ctxAlerts = document.getElementById('alertTrend').getContext('2d');
    new Chart(ctxAlerts, {
        type: 'bar',
        data: {
            labels: ['2024-06-15', '2024-06-16', '2024-06-17', '2024-06-18'],
            datasets: [{
                label: 'Alerts',
                data: [2, 3, 2, 2],
                backgroundColor: '#fbbf24'
            }]
        },
        options: {
            plugins: {legend: {display: false}},
            scales: {y: {beginAtZero: true, max: 5}, x:{ticks:{color:'#555'}}}
        }
    });
    </script>
</body>
</html>
